services:
  db:
    image: pgvector/pgvector:pg17
    container_name: khedma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: khedma
      POSTGRES_PASSWORD: khedma
      POSTGRES_DB: khedma
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - khedma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khedma"]
      interval: 5s
      retries: 10

volumes:
  khedma-pgdata:
